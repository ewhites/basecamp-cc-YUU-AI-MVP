<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Activity · YUU AI Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/users.js"></script>
  <script src="js/auth.js"></script>
  <script>const USER = requireAuth();</script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="wordmark" href="dashboard.html"><span class="c1">Y</span><span class="c2">U</span><span class="c3">U</span> <span class="rest">AI Lab</span></a>
      <div class="user">
        <button class="btn btn-outline" onclick="logout()">Sign out</button>
      </div>
    </div>
  </header>

  <main>
    <a class="back" href="dashboard.html">&larr; Back to dashboard</a>
    <section class="placeholder" id="placeholder"></section>
  </main>

  <script src="js/features.js"></script>
  <script>
    const id = new URLSearchParams(location.search).get("f");
    const f = FEATURES.find((x) => x.id === id);
    if (!f) {
      location.replace("dashboard.html");
    } else {
      document.title = `${f.title} · YUU AI Lab`;
      const el = document.getElementById("placeholder");
      el.className = `placeholder accent-${f.accent}`;
      el.innerHTML = `
        <div class="icon">${ICONS[f.icon]}</div>
        <h1>${f.title}</h1>
        <p>${f.blurb}</p>
        <span class="badge">Under construction</span>`;
    }
  </script>
</body>
</html>
