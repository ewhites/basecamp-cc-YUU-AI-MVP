<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard · YUU AI Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/users.js"></script>
  <script src="js/auth.js"></script>
  <script>const USER = requireAuth();</script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="wordmark" href="dashboard.html"><span class="c1">Y</span><span class="c2">U</span><span class="c3">U</span> <span class="rest">AI Lab</span></a>
      <div class="user">
        <span class="name" id="greeting"></span>
        <span class="avatar" id="avatar"></span>
        <button class="btn btn-outline" onclick="logout()">Sign out</button>
      </div>
    </div>
  </header>

  <main>
    <section class="hero">
      <div>
        <h1>Your AI learning journey</h1>
        <p>Practice prompting, compare models, and build your first bot, all in one safe space.</p>
      </div>
      <div>
        <div class="progress-label"><span>Cycle progress</span><span id="progress-text">0 of 4 modules</span></div>
        <div class="progress"><span id="progress-bar" style="width: 3%"></span></div>
      </div>
    </section>

    <h2 class="section-title">Learning activities</h2>
    <div class="grid" id="features"></div>
  </main>

  <script src="js/features.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
